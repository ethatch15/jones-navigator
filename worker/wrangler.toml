name = "jones-navigator"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Websites allowed to call this Worker, comma-separated. Update this if your GitHub username changes.
ALLOWED_ORIGINS = "https://ethatch15.github.io,http://localhost:8000"
# Claude model. claude-opus-5-5 is the most capable everyday model.
# For lower cost, claude-sonnet-5-5 also works with these settings.
MODEL = "claude-opus-5-5"
# How hard Claude thinks before answering: low, medium, high. "low" keeps chat fast and cheap.
EFFORT = "low"
MAX_TOKENS = "16000"
# "on" lets Claude search rice.edu sites for current club rosters and dates (a small extra cost per search).
WEB_SEARCH = "on"

# The Claude API key is NOT stored here. Add it as a secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
